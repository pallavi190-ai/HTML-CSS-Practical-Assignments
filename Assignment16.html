<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 16: Create a student-registration form using basic input types.</title>
</head>
<body>

    <header>
        <h1>Student Registration Form</h1>
        <p>Please fill in your details below.</p>
    </header>

    <main>
        <form action="#" method="post">
            
            <fieldset>
                <legend>Personal Information</legend>

                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                <br><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                <br><br>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
                <br><br>

                <label for="age">Age:</label>
                <input type="number" id="age" name="age" min="16" max="100" required>
                <br><br>

                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>
                <br><br>

                <p>Gender:</p>
                <input type="radio" id="male" name="gender" value="male">
                <label for="male">Male</label>

                <input type="radio" id="female" name="gender" value="female">
                <label for="female">Female</label>

                <input type="radio" id="other" name="gender" value="other">
                <label for="other">Other</label>
            </fieldset>

            <br>

            <fieldset>
                <legend>Course Information</legend>

                <label for="course">Select Course:</label>
                <select id="course" name="course" required>
                    <option value="">-- Select Course --</option>
                    <option value="BCA">BCA</option>
                    <option value="BCA AI">BCA Artificial Intelligence</option>
                    <option value="BBA">BBA</option>
                    <option value="BSc">B.Sc.</option>
                    <option value="BA">B.A.</option>
                </select>
                <br><br>

                <p>Interests:</p>
                <input type="checkbox" id="coding" name="interests" value="Coding">
                <label for="coding">Coding</label>

                <input type="checkbox" id="sports" name="interests" value="Sports">
                <label for="sports">Sports</label>

                <input type="checkbox" id="reading" name="interests" value="Reading">
                <label for="reading">Reading</label>
                <br><br>

                <label for="phone">Phone Number:</label>
                <input type="telephone" id="phone" name="phone" placeholder="Enter phone number">
                <br><br>

                <label for="address">Address:</label>
        <textarea id="address" name="address" rows="4" cols="30" placeholder="Enter your address"></textarea>
    </fieldset>

    <br>

    <input type="checkbox" id="terms" name="terms" required>
    <label for="terms">I confirm that the information is accurate</label>

    <br><br>

    <button type="submit">Register</button>
    <button type="reset">Reset</button>

</form>
</main>

<footer>
    <p>&copy; 2026 Student Registration Form</p>
</footer>

</body>
</html>
