<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 17: Build a job-application style form using every input type covered.</title>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 25px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #234a70;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            box-sizing: border-box;
            border: 1px solid #bbb;
            border-radius: 5px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            width: auto;
        }

        input[type="range"] {
            padding: 0;
        }

        button {
            background: #234a70;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:hover {
            background: #163550;
        }

        .choice {
            font-weight: normal;
            display: inline-block;
            margin-right: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <h1>Job Application Form</h1>
        <p>Please fill in your details to apply for the job.</p>

        <form action="#" method="post" enctype="multipart/form-data">
            
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="example@email.com" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" placeholder="Enter phone number">

            <label for="password">Create Password:</label>
            <input type="password" id="password" name="password" minlength="8" required>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">

            <label for="interview">Preferred Interview Time:</label>
            <input type="time" id="interview" name="interview">

            <label for="available">Available From:</label>
            <input type="datetime-local" id="available" name="available">

            <label for="month">Preferred Joining Month:</label>
            <input type="month" id="month" name="month">

            <label for="week">Preferred Joining Week:</label>
            <input type="week" id="week" name="week">

            <label for="portfolio">Portfolio Website:</label>
            <input type="url" id="portfolio" name="portfolio" placeholder="https://example.com">

            <label for="experience">Years of Experience:</label>
            <input type="number" id="experience" name="experience" min="0" max="50" value="0">

        <label for="salary">Expected Salary (₹ per month):</label>
            <input type="range" id="salary" name="salary" min="10000" max="100000" step="5000" value="50000" oninput="salaryValue.value = this.value">
            <output id="salaryValue">50000</output>

            <label for="color">Choose a Theme Color:</label>
            <input type="color" id="color" name="color" value="#234a70">

            <label for="resume">Upload Resume:</label>
            <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">

            <label for="search">Search Job Role:</label>
            <input type="search" id="search" name="jobrole" placeholder="e.g. Web Developer">

            <label>Gender:</label>
            <label class="choice">
                <input type="radio" name="gender" value="male"> Male
            </label>
            <label class="choice">
                <input type="radio" name="gender" value="female"> Female
            </label>
            <label class="choice">
                <input type="radio" name="gender" value="other"> Other
            </label>

            <label>Skills:</label>
            <label class="choice">
                <input type="checkbox" name="skills" value="html"> HTML
            </label>
            <label class="choice">
                <input type="checkbox" name="skills" value="css"> CSS
            </label>
            <label class="choice">
                <input type="checkbox" name="skills" value="javascript"> JavaScript
            </label>
            <label class="choice">
                <input type="checkbox" name="skills" value="python"> Python
            </label>

            <label for="position">Select Position:</label>
            <select id="position" name="position" required>
                <option value="">-- Choose a Position --</option>
                <option value="web">Web Developer</option>
                <option value="software">Software Developer</option>
                <option value="designer">UI/UX Designer</option>
                <option value="data">Data Analyst</option>
            </select>

            <label for="address">Address:</label>
            <textarea id="address" name="address" rows="4" placeholder="Enter your address"></textarea>

            <label for="notice">Notice Period (days):</label>
            <input type="number" id="notice" name="notice" min="0">

            <input type="hidden" name="form_source" value="job-application">

            <label class="choice">
                <input type="checkbox" name="declaration" required>
                I confirm that the information provided is correct.
            </label>

            <br>

            <button type="submit">Submit Application</button>
            <button type="reset">Reset Form</button>

        </form>
    </div>

</body>
</html>
