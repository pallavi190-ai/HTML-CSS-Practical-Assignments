<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="My personal introduction page with embedded CSS styling.">
    <title>Question 21: Convert one HTML-only page from week 4 into a CSS stylized page.</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }

        header {
            background-color: #3563a9;
            color: white;
            text-align: center;
            padding: 20px;
            border-radius: 8px;
        }

        main {
            background-color: white;
            max-width: 700px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 8px;
        }

        h2 {
            color: #3563a9;
        }

        footer {
            text-align: center;
            padding: 10px;
            color: #555;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Page</h1>
        <p>My Personal Introduction</p>
    </header>

    <main>
        <h2>About Me</h2>
        <p>Hello! I am a college student learning web development.</p>

        <h2>My Hobbies</h2>
        <ul>
            <li>Reading</li>
            <li>Listening to music</li>
            <li>Learning new skills</li>
        </ul>

        <h2>My Goal</h2>
        <p>My goal is to improve my technical skills and become a successful developer.</p>
    </main>

    <footer>
        <p>&copy; 2026 My Personal Page</p>
    </footer>

</body>
</html>
