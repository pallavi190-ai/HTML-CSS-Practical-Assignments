<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A student page demonstrating four types of CSS selectors.">
    <title>Question 22: Style a page using at least four different types of selectors.</title>

    <style>
        /* 1. Element selector */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 20px;
            color: #333;
        }

        /* 2. Class selector */
        .highlight {
            color: #1a569a;
            background-color: #e0f0ff;
            padding: 10px;
            border-radius: 5px;
        }

        /* 3. ID selector */
        #main-heading {
            text-align: center;
            color: white;
            background-color: #3563a9;
            padding: 20px;
            border-radius: 8px;
        }

        /* 4. Descendant selector */
        main p {
            line-height: 1.8;
            font-size: 17px;
        }

        main ul {
            background-color: white;
            padding: 20px 40px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1 id="main-heading">My Student Page</h1>

    <main>
        <h2>About Me</h2>
        <p>Hello! I am a student learning HTML and CSS.</p>

        <p class="highlight">
            I am practicing different types of CSS selectors.
        </p>

        <h2>My Skills</h2>
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>Web Development</li>
        </ul>
    </main>

</body>
</html>
