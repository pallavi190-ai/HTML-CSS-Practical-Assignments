<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Navbar & Hero Section</title>
    <style>
        /* Modern System Font & Global Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #090d16;
            color: #f8fafc;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glowing Background Orbs */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(140px);
            z-index: -1;
            opacity: 0.4;
        }
        body::before {
            background: #6366f1;
            top: -100px;
            right: -50px;
        }
        body::after {
            background: #d946ef;
            bottom: 10%;
            left: -100px;
        }

        /* --- ATTRACTIVE FIXED NAVBAR --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(9, 13, 22, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 20px 8%;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }

        .navbar .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-decoration: none;
            background: linear-gradient(45deg, #a855f7, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 35px;
            align-items: center;
        }

        .nav-links a {
            position: relative;
            color: #94a3b8;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            padding: 6px 0;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #ffffff;
        }

        /* Sliding Underline Effect */
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #a855f7, #6366f1);
            transition: width 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border-radius: 2px;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        /* Dynamic CTA Header Button */
        .nav-links .nav-cta {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: #ffffff !important;
            padding: 10px 22px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.25);
            transition: all 0.3s ease;
        }

        .nav-links .nav-cta::after {
            display: none;
        }

        .nav-links .nav-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
        }

        /* --- MODERN SPLIT HERO SECTION --- */
        .hero-section {
            min-height: 100vh;
            padding: 140px 8% 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
        }

        /* Left Content Column */
        .hero-content {
            flex: 1;
            max-width: 600px;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.25);
            color: #818cf8;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 24px;
        }

        .hero-content h1 {
            font-size: clamp(38px, 5vw, 56px);
            font-weight: 800;
            line-height: 1.15;
            color: #ffffff;
            margin-bottom: 20px;
        }

        .hero-content h1 span {
            background: linear-gradient(135deg, #6366f1, #d946ef);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-content p {
            font-size: 17px;
            color: #94a3b8;
            line-height: 1.7;
            margin-bottom: 35px;
        }

        /* Main Conversion Buttons */
        .hero-btn-group {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #d946ef);
            color: white;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.5);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        /* Right Illustration Column */
        .hero-visual {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Mock Abstract Interface Panel */
        .abstract-panel {
            width: 100%;
            max-width: 440px;
            height: 380px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01));
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            position: relative;
            animation: float 6s ease-in-out infinite;
        }

        /* Mock UI Element Blocks inside panel */
        .panel-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            margin-bottom: 25px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
        }

        .panel-line {
            width: 80%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-bottom: 12px;
        }
        .panel-line.short {
            width: 50%;
        }

        /* Smooth Floating Animation */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* --- RESPONSIVE MEDIA QUERIES --- */
        @media (max-width: 968px) {
            .hero-section {
                flex-direction: column;
                text-align: center;
                padding-top: 160px;
                gap: 60px;
            }

            .hero-content {
                max-width: 100%;
            }

            .hero-btn-group {
                justify-content: center;
            }

            .abstract-panel {
                height: 320px;
                max-width: 380px;
            }
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 15px 5%;
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                gap: 20px;
                font-size: 14px;
            }

            .nav-links .nav-cta {
                padding: 8px 16px;
            }
            
            .hero-section {
                padding-left: 5%;
                padding-right: 5%;
            }
        }
    </style>
</head>
<body>

    <!-- Fixed Header Navigation Context -->
    <nav class="navbar">
        <a href="#" class="logo">NEXUS</a>
        <ul class="nav-links">
            <li><a href="#features">Features</a></li>
            <li><a href="#pricing">Pricing</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#signup" class="nav-cta">Get Started</a></li>
        </ul>
    </nav>

    <!-- Interactive Hero Display -->
    <main>
        <section class="hero-section">
            
            <!-- Information Content Frame -->
            <div class="hero-content">
                <div class="hero-badge">✨ NOW IN BETA v2.0</div>
                <h1>Design the Next <br><span>Digital Era</span></h1>
                <p>Build blazing fast, responsive layouts using native structural systems. Empower your workflow with minimal overhead configurations built cleanly from the ground up.</p>
                
                <div class="hero-btn-group">
                    <a href="#signup" class="btn-primary">Get Started</a>
                    <a href="#features" class="btn-secondary">Learn More</a>
